name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUSTFLAGS: --deny warnings
  RUST_TOOLCHAIN: 1.94.0
  LANGUAGES: de fr es pt ru zh ja ko fil ar hi it nl

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust Toolchain Components
      uses: actions-rs/toolchain@v1
      with:
        override: true
        toolchain: stable

    - uses: Swatinem/rust-cache@v2

    - uses: peaceiris/actions-mdbook@v1
      with:
        mdbook-version: '0.4.52'

    - name: Install mdbook-i18n-helpers
      run: cargo install mdbook-i18n-helpers --version 0.3.5 --locked

    - name: Install mdbook-linkcheck
      run: |
        mkdir -p mdbook-linkcheck
        cd mdbook-linkcheck
        wget https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/latest/download/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip
        unzip mdbook-linkcheck.x86_64-unknown-linux-gnu.zip
        chmod +x mdbook-linkcheck
        pwd >> $GITHUB_PATH

    - name: Build docs
      run: mdbook build docs -d build

    - name: Build all translations for docs
      run: |
        for lang in ${{ env.LANGUAGES }}; do
          echo "::group::Building $lang translation"
          MDBOOK_BOOK__LANGUAGE=$lang \
            mdbook build docs -d build/$lang
          mv docs/build/$lang/html docs/build/html/$lang
          echo "::endgroup::"
        done

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust Toolchain Components
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
        rustup default "$RUST_TOOLCHAIN"

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Clippy
      run: cargo clippy --locked --all --all-targets -- -D warnings

    - name: Format
      run: cargo fmt --all -- --check

    - name: Check for Forbidden Words
      run: |
        sudo apt-get install ripgrep
        ./bin/forbid

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-latest
        - ubuntu-latest
        - windows-latest

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust Toolchain Components
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
        rustup default "$RUST_TOOLCHAIN"

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Test
      run: cargo test --locked --all -- --test-threads=4
