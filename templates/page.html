<!doctype html>
<html lang=en>
  <head>
    <meta charset=utf-8>
    <meta name=format-detection content='telephone=no'>
    <meta name=viewport content='width=device-width,initial-scale=1.0'>
    <meta property=og:title content='{{ self.content.title() }}'>
    <meta property=og:image content='{{ self.og_image() }}'>
    <meta property=twitter:card content=summary>
    <title>{{ self.content.title() }}</title>
    <link rel=alternate href=/feed.xml type=application/rss+xml title='Inscription Feed'>
    <link rel=icon href=/static/liteverse-symbol-v1.png type=image/png>
    <link rel=stylesheet href=/static/index.css>
    <link rel=stylesheet href=/static/modern-normalize.css>
    <link rel=stylesheet href=/static/ord-liteverse-v1.css>
    <script src=/static/index.js defer></script>
  </head>
  <body class=ord-liteverse>
  <header>
    <nav aria-label=Explorer>
      <a class=brand href=/ title=home aria-label="ORD&#8226;LITEVERSE home"><img class=brand-logo src=/static/liteverse-symbol-v1.png alt="" width=48 height=30><span class=brand-name>ORD<span class=brand-dot>&#8226;</span>LITEVERSE</span></a>
      <span class=brand-network>{{ self.superscript() }}</span>
      <div class=explorer-links>
      <a href=/inscriptions title=inscriptions aria-label=Inscriptions><img class=icon src=/static/images.svg alt=""></a>
      <a href=/runes title=runes aria-label=Runes><img class=icon src=/static/rune.svg alt=""></a>
      <a href=/collections title=collections aria-label=Collections><img class=icon src=/static/diagram-project.svg alt=""></a>
      <a href=/blocks title=blocks aria-label=Blocks><img class=icon src=/static/cubes.svg alt=""></a>
      <a href=/clock title=clock aria-label=Clock><img class=icon src=/static/clock.svg alt=""></a>
%% if self.config.index_sats {
      <a href=/rare.txt title=rare aria-label="Rare sats"><img class=icon src=/static/gem.svg alt=""></a>
%% }
      <a href=https://github.com/LiteVerseHoldings/ord-litecoin#readme title=documentation aria-label=Documentation><img class=icon src=/static/book.svg alt=""></a>
      <a href=https://github.com/LiteVerseHoldings/ord-litecoin title=github aria-label=GitHub><img class=icon src=/static/github.svg alt=""></a>
      <a href=https://discord.gg/SPHJP383dE title=discord aria-label=Community><img class=icon src=/static/discord.svg alt=""></a>
      </div>
      <form class=explorer-search action=/search method=get role=search>
        <input type=text autocapitalize=off autocomplete=off autocorrect=off name=query spellcheck=false aria-label="Search the Litecoin explorer" placeholder="Search Litecoin">
        <input class=icon type=image src=/static/magnifying-glass.svg alt=Search>
      </form>
    </nav>
  </header>
  <main>
$$ Trusted(&self.content)
  </main>
  </body>
</html>
