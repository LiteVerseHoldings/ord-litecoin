<!doctype html>
<html lang=en>
  <head>
    <meta charset=utf-8>
    <meta name=format-detection content='telephone=no'>
    <style>
      html, body {
        background: #131516;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      iframe {
        border: 0;
        display: block;
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <iframe
      sandbox=allow-scripts
      loading=lazy
      referrerpolicy=no-referrer
      src=/content/{{self.inscription_id}}
      title='sandboxed inscription {{self.inscription_id}}'
    ></iframe>
  </body>
</html>
